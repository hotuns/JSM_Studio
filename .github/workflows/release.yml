name: Release JSM Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JSM_GUI/jsm_gui_tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm ci

      - name: Verify bundled engine provenance
        shell: pwsh
        run: |
          $runtimeDir = 'JSM_GUI/jsm_gui_tauri/src-tauri/bin/SDL'
          $manifest = Get-Content "$runtimeDir/runtime-manifest.json" -Raw | ConvertFrom-Json
          $engineCommit = (git -C JoyShockMapper rev-parse HEAD).Trim()
          if ($manifest.sourceDirty -or $manifest.sourceCommit -ne $engineCommit) {
            throw 'Bundled runtime does not match the committed engine source.'
          }
          foreach ($file in $manifest.files) {
            $hash = (Get-FileHash -LiteralPath "$runtimeDir/$($file.name)" -Algorithm SHA256).Hash
            if ($hash -ne $file.sha256) { throw "Runtime hash mismatch: $($file.name)" }
          }

      - name: Build, sign, and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: JSM_GUI/jsm_gui_tauri
          tagName: v__VERSION__
          releaseName: JSM Studio v__VERSION__
          releaseBody: Download the Windows installer below. The application can check this release for future updates.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
